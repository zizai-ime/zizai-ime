# 字在官網：由 README、LICENSE.md、PRIVACY.md 與 docs/ 建置，部署到 GitHub Pages。
name: 官網

on:
  push:
    branches: [main]
    paths:
      - README.md
      - LICENSE.md
      - PRIVACY.md
      - "docs/**"
      - "site/**"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝建置用的套件
        run: python -m pip install --require-hashes --only-binary :all: -r site/requirements.txt
      - name: 建置
        run: python site/build.py --out _site
      - name: 檢查
        run: python site/check.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
